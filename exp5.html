<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5efe6;
            margin: 0;
            padding: 30px;
        }

        .form-box {
            background-color: #fffaf3;
            max-width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px #d2c0aa;
        }

        h1 {
            text-align: center;
            color: #4b2e1e;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #4b2e1e;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #c9b39a;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #fdf8f1;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #8b5e3c;
        }

        .full {
            grid-column: 1 / 3;
        }

        textarea {
            height: 80px;
        }

        button {
            background-color: #4b2e1e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6b4226;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Student Admission Form</h1>

        <form>

            <div>
                <label>Student Name</label>
                <input type="text" placeholder="Enter name">
            </div>

            <div>
                <label>Age</label>
                <input type="number" placeholder="Enter age">
            </div>

            <div>
                <label>Email</label>
                <input type="email" placeholder="Enter email">
            </div>

            <div>
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>

            <div>
                <label>Gender</label>
                <select>
                    <option>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <div>
                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>CSE</option>
                    <option>AI & DS</option>
                    <option>ECE</option>
                    <option>EEE</option>
                </select>
            </div>

            <div class="full">
                <label>Address</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>

            <div class="full">
                <button type="submit">Submit Application</button>
            </div>

        </form>

    </div>

</body>
</html>\
